<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preload" as="image" href="/startup-logo.webp" fetchpriority="high" />
    <link rel="icon" type="image/png" href="/TolobaLogoAnand.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toloba Ul Kulliyaat Il Muminoon - Treasury Portal</title>
    <style>
      body { margin: 0; }
      #root:not(:empty) + .startup { display: none; }
      .startup { position: fixed; inset: 0; display: grid; place-items: center; background: #f8fafc; color: #10442f; font: 600 0.875rem system-ui, sans-serif; }
      .startup-content { display: grid; justify-items: center; gap: 1.25rem; padding: 1rem; text-align: center; }
      .startup-mark { position: relative; width: clamp(7rem, 32vmin, 12rem); aspect-ratio: 1; display: grid; place-items: center; }
      .startup-mark::before { content: ""; position: absolute; inset: 5%; border-radius: 50%; border: 1px solid #287e5766; background: radial-gradient(circle, #d9eee0, transparent 70%); animation: startup-ring 2.2s ease-out infinite; }
      .startup-mark img { position: relative; width: 100%; height: 100%; object-fit: contain; animation: startup-logo-settle 480ms cubic-bezier(.22,1,.36,1) both; }
      @keyframes startup-ring { from { transform: scale(.92); opacity: .8; } to { transform: scale(1.32); opacity: 0; } }
      @keyframes startup-logo-settle { from { transform: scale(.94); } to { transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) { .startup-mark::before, .startup-mark img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="startup" role="status">
      <div class="startup-content">
        <div class="startup-mark">
          <img src="/startup-logo.webp" alt="Toloba" fetchpriority="high" width="367" height="384" />
        </div>
        <span>Loading treasury portal…</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
